services:
  - type: web
    name: demo-server
    env: node
    plan: free
    rootDir: .
    buildCommand: npm ci && npm run build:server:prod
    startCommand: npm --prefix server run start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: NODE_ENV
        value: production

  - type: web
    name: demo-client
    env: static
    rootDir: .
    buildCommand: npm ci && NODE_OPTIONS=--max-old-space-size=2048 npm run build:client:prod
    staticPublishPath: client/dist
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: NODE_ENV
        value: production
